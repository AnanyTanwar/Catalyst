name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, avx2, bmi2, avx512, avx512vnni]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y g++ make binutils

      - name: Download NNUE
        run: make net

      - name: Build
        run: make linux-${{ matrix.arch }}

  sanitize:
    name: Sanitizer (ASan + UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y g++ make binutils

      - name: Download NNUE
        run: make net

      - name: Fix ASan mmap entropy on GitHub runners
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build with sanitizers
        run: make sanitize

      - name: Run bench under sanitizers
        run: ./bin/catalyst-debug bench

      - name: Run perft under sanitizers
        run: ./bin/catalyst-debug perft 5

      - name: Run UCI test under sanitizers
        run: echo "uci\nisready\nquit" | ./bin/catalyst-debug
